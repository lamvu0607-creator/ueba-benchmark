# Model hyperparameter configurations for UEBA Anomaly Detection

# ---------------------------------------------------------------------------
# Tham số dùng chung — registry tách rõ 3 loại cấu hình: defaults / training / preprocessing
# ---------------------------------------------------------------------------
defaults:
  contamination: 0.05 # ngân sách cảnh báo: threshold_ = quantile(score_train, 1 - contamination)
  random_state: 42

training:
  # null = mỗi mô hình dùng ngân sách mặc định của lớp. Từ khi chuyển sang PyOD (2026-10-05), cả
  # Isolation Forest, LOF (HNSW) và One-Class SVM (Nystroem + SGD) đều fit TOÀN BỘ tập train
  # (721.612 dòng ngày 1–42). Đặt một số nguyên để ép mọi mô hình về cùng mẫu con.
  max_train_samples: null

preprocessing:
  imputer: "median" # median fit trên tập train (KHÔNG fill 0 các NULL hợp lệ như interarrival_dt_mean)
  scaler: "robust" # chỉ áp dụng cho mô hình requires_scaling (IF/LOF/OCSVM); baseline dùng đơn vị gốc
  feature_set: "core" # 39 đặc trưng core trong configs/feature_schema.yaml (v4.0)

# ---------------------------------------------------------------------------
# Phân khúc (Segmented UEBA Benchmark) — mỗi phân khúc có imputer/scaler/mô hình RIÊNG
# ---------------------------------------------------------------------------
# Machine (24/7, Kerberos/Network, khối lượng lớn) và User (giờ hành chính, Interactive/RDP) có phân phối
# rất khác nhau; fit chung một mô hình làm trộn quần thể (Simpson's paradox). Nhóm thiểu số
# (Admin/Service/System: < 0,25% dòng, 1–10 tài khoản) không đủ mẫu cho học máy không giám sát
# (LOF sụp láng giềng k = 20, OCSVM phân cực) ⇒ bị LOẠI khỏi benchmark ML, xử lý bằng rule/whitelist ở tầng khác.
# Bỏ khối này (hoặc enabled: []) hoặc chạy với --no-segments ⇒ quay về một mô hình chung cho mọi dòng.
segments:
  column: "entity_type" # cột phân khúc trong ma trận đặc trưng
  enabled: ["Machine", "User"] # mỗi giá trị = một phân khúc chạy riêng
  ignored: ["Admin", "Service", "System", "Other"] # bỏ qua có chủ đích (giá trị lạ cũng bị bỏ, kèm cảnh báo)

# Ba thuật toán chạy qua giao diện PyOD (src/models/detectors.py). decision_function của PyOD đã là
# CAO = DỊ BIỆT; ngưỡng cảnh báo vẫn do BaseAnomalyModel tính (phân vị 1 − contamination trên tập fit).
isolation_forest: # pyod.models.iforest.IForest
  n_estimators: 150
  max_samples: "auto"
  contamination: 0.05
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1

local_outlier_factor: # HNSWLOF — LOF trên láng giềng xấp xỉ hnswlib (src/models/pyod_detectors.py)
  n_neighbors: 20
  M: 32 # số cạnh mỗi nút của đồ thị HNSW
  ef_construction: 200 # độ rộng tìm kiếm khi dựng index
  ef: 200 # độ rộng tìm kiếm khi truy vấn (tăng nếu Spearman với LOF chính xác < 0,99)
  contamination: 0.05
  n_jobs: -1 # đặt 1 nếu cần kết quả tất định tuyệt đối (add_items đa luồng đổi thứ tự chèn)
  dedup: true # index trên dòng DUY NHẤT: tránh k-distance = 0 ⇒ LOF ~1e10 (p100 cũ ≈ 2e10)
  min_k_distance: 0.0 # sàn k-distance (0 = tắt); chỉ cần khi dedup: false

one_class_svm: # NystroemSGDOCSVM — OCSVM nhân RBF xấp xỉ: Nystroem → SGDOneClassSVM
  n_components: 300 # số thành phần Nystroem
  gamma: "scale" # = 1 / (n_features · X.var()) trên dữ liệu đã RobustScaler, tính lúc fit
  nu: 0.05 # đồng bộ với contamination (ngân sách cảnh báo)
  max_iter: 1000
  tol: 0.001
  learning_rate: "optimal"

# ---------------------------------------------------------------------------
# Baseline label-free (Tuần 3) — 3 mốc so sánh KHÔNG cần nhãn
# ---------------------------------------------------------------------------
# Điểm của Z-score: agg_j |(x_j - loc_j) / scale_j|  (điểm CAO = DỊ BIỆT)
zscore_baseline:
  method: "robust" # robust = median/MAD*1.4826 (chống outlier) | classic = mean/std
  agg: "max" # max = có bất kỳ đặc trưng nào lệch mạnh | mean | p95
  z_threshold: 3.0 # ngưỡng tuyệt đối |z| >= 3, CHỈ dùng khi threshold_mode: "fixed"
  threshold_mode: "quantile" # quantile = ngân sách cảnh báo theo contamination (so sánh được với ML)

# Điểm của baseline luật: tỷ lệ luật được thoả (0..1). Luật làm việc theo TÊN đặc trưng.
rule_threshold_baseline:
  threshold_mode: "quantile" # "fixed" -> cảnh báo khi thoả >= min_rules luật
  min_rules: 2 # chỉ dùng khi threshold_mode: "fixed"
  rules:
    - feature: "failure_ratio"
      op: ">="
      value: 0.5
      rationale: "Tỷ lệ đăng nhập thất bại cao — dấu hiệu brute force/dò mật khẩu (schema ghi rõ đây là đặc trưng cường độ thất bại DUY NHẤT)."
    - feature: "failure_locked_out_share"
      op: ">="
      value: 0.5
      rationale: "Phần lớn thất bại là do tài khoản bị khoá — mức leo thang của tấn công (tín hiệu lockout)."
    - feature: "ntlm_ratio"
      op: ">="
      value: 0.5
      rationale: "NTLM chiếm ưu thế trong ngày — schema ghi NTLM là 48.18% ở event 4625 so với 17.35% ở 4624."
    - feature: "off_hours_ratio"
      op: ">="
      value: 0.5
      rationale: "Hoạt động chủ yếu ngoài giờ làm việc (18h-7h) — trái nhịp hành vi bình thường."
    - feature: "same_second_share"
      op: ">="
      value: 0.5
      rationale: "Nhiều sự kiện cùng một giây (delta_t = 0) — burst bất thường của công cụ tự động."
    - feature: "remote_logon_ratio"
      op: ">="
      value: 0.9
      rationale: "Gần như toàn bộ đăng nhập đến từ nguồn khác host (Source != LogHost) — truy cập từ xa."

# Điểm của baseline ngẫu nhiên: băm tất định theo nội dung dòng → đều trong [0, 1).
# Là MỐC DƯỚI cho mọi chỉ số (ROC-AUC kỳ vọng 0,5 · AP/Precision@K kỳ vọng ≈ tỷ lệ dương tính).
# Đổi random_state ⇒ bộ điểm khác, nhưng alert rate vẫn ~ contamination (ngưỡng là phân vị trên train).
random_baseline:
  random_state: 42
