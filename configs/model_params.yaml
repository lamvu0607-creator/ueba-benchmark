# Model hyperparameter configurations for UEBA Anomaly Detection

isolation_forest:
  n_estimators: 150
  max_samples: "auto"
  contamination: 0.05
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1

local_outlier_factor:
  n_neighbors: 20
  algorithm: "auto"
  leaf_size: 30
  metric: "minkowski"
  p: 2
  contamination: 0.05
  novelty: true # Required for out-of-sample prediction and scoring
  n_jobs: -1

one_class_svm:
  kernel: "rbf"
  degree: 3
  gamma: "scale"
  coef0: 0.0
  tol: 0.001
  nu: 0.05 # Upper bound on fraction of training errors, lower bound on support vectors
  shrinking: true
