# =============================================================================
# Khối TEST với bộ 22 đặc trưng (tuần 5, chốt K = 18) — bản sao của configs/benchmark_grid_test.yaml (cấu hình mô
# hình chốt từ dev, KHÔNG chọn lại), chỉ thêm:
#   drop_features: 19 đặc trưng = nhóm rhythm (4) + 18 đặc trưng SHAP thấp nhất (xếp theo tỷ phần |SHAP| cao nhất
#                  qua 3 mô hình x 3 run dev; 3 đặc trưng trùng rhythm), cấu hình drop_rhythm_k18 trong
#                  reports/week5/chon_so_dac_trung_K.md; chỉ áp dụng cho mô hình ML, baseline giữ nguyên.
#   sort_rows:     sắp dòng cố định trước khi fit (thứ tự dòng làm lệch OCSVM/IF).
# =============================================================================
block: test
segment: User
output_dir: experiments/grid/test_22f
runs:
- data/injection_runs/test_seed20261061
- data/injection_runs/test_seed20261062
- data/injection_runs/test_seed20261063
- data/injection_runs/test_seed20261064
- data/injection_runs/test_seed20261065
model_seeds:
- 42
- 7
- 2024
- 1
- 2
contamination: 0.05
precision_ks:
- 10
- 50
- 100
daily_budgets:
- 10
- 50
- 100
models:
  isolation_forest:
  - id: if_n300_ms1024
    scaler: robust
    params:
      n_estimators: 300
      max_samples: 1024
  local_outlier_factor:
  - id: lof_k20_robust
    scaler: robust
    params: {}
  one_class_svm:
  - id: ocsvm_standard_nc1000
    scaler: standard
    params:
      n_components: 1000
baselines:
- zscore_baseline
- rule_threshold_baseline
- failure_count_baseline
- random_baseline
contamination_sweep:
- 0.001
- 0.002
- 0.005
- 0.01
- 0.02
- 0.05
- 0.1
- 0.2
sort_rows: true
drop_features:
- interarrival_dt_mean
- delta_t_cv
- same_second_share
- is_single_event
- activity_peak_hour_sin
- log_distinct_hosts
- missing_source_ratio
- dst_host_entropy
- log_total_logons
- custom_proc_share
- delta_mean_distinct_pair_7d
- new_host_count_7d
- peer_z_share_night
- rare_logon_type_count_log
- remote_logon_ratio
- volume_robust_z_7d
- off_hours_ratio
- delta_mean_distinct_fail_host_7d
- jaccard_logontype_7d
