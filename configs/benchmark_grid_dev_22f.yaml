# =============================================================================
# Khối DEV với bộ 22 đặc trưng — bản sao của configs/benchmark_grid.yaml (13 cấu hình, fit 1–35, đánh giá 36–42),
# chỉ thêm drop_features + sort_rows giống configs/benchmark_grid_test_22f.yaml, để bảng 3 mô hình × ≥ 3 cấu hình
# khớp với bộ đặc trưng cuối. Quét contamination rút về một mức (0,05): độ nhạy contamination của bộ 22 đặc trưng
# đã có trên test (experiments/grid/test_22f/).
# =============================================================================
block: dev
segment: User
output_dir: "experiments/grid/dev_22f"
split_day: 35          # dev 36–42 nằm trong train: mô hình fit trên ngày 1–35 (kiểm tra với run_config.json)

runs:
  - "data/injection_runs/dev_seed20261036"
  - "data/injection_runs/dev_seed20261037"
  - "data/injection_runs/dev_seed20261038"
  - "data/injection_runs/dev_seed20261039"
  - "data/injection_runs/dev_seed20261040"
model_seeds: [42, 7, 2024, 1, 2]

# Ngân sách cảnh báo của lưới (ngưỡng = phân vị 1 − contamination của điểm TRAIN).
contamination: 0.05
precision_ks: [10, 50, 100]
daily_budgets: [10, 50, 100]

# Mỗi cấu hình: id duy nhất, scaler (robust | standard | quantile) và tham số ghi đè khối của mô hình trong
# configs/model_params.yaml. Isolation Forest bất biến với phép scale đơn điệu từng cột nên chỉ đổi siêu tham số.
# Scaler là một chiều của lưới vì RobustScaler làm lệch thang đo: đặc trưng có IQR rất nhỏ bị phóng đại
# (failure_ratio ×1.400) còn đặc trưng IQR = 0 giữ đơn vị gốc — LOF/OCSVM (dựa trên khoảng cách) bị ảnh hưởng.
models:
  isolation_forest:
    - {id: if_default, scaler: robust, params: {}}
    - {id: if_n300_ms1024, scaler: robust, params: {n_estimators: 300, max_samples: 1024}}
    - {id: if_maxfeat05, scaler: robust, params: {max_features: 0.5}}
  local_outlier_factor:
    - {id: lof_k20_robust, scaler: robust, params: {}}
    - {id: lof_k20_standard, scaler: standard, params: {}}
    - {id: lof_k20_quantile, scaler: quantile, params: {}}
    - {id: lof_k100_standard, scaler: standard, params: {n_neighbors: 100}}
  one_class_svm:
    - {id: ocsvm_robust, scaler: robust, params: {}}
    - {id: ocsvm_standard, scaler: standard, params: {}}
    - {id: ocsvm_quantile, scaler: quantile, params: {}}
    - {id: ocsvm_standard_nc1000, scaler: standard, params: {n_components: 1000}}
    # gamma: "scale" = 1/(n_features·Var(X)) (41 đặc trưng: ≈ 1/39 ≈ 0,026; 22 đặc trưng: ≈ 0,045) sau StandardScaler -> quét ÷5 và ×4 quanh giá trị đó
    - {id: ocsvm_standard_g0005, scaler: standard, params: {gamma: 0.005}}
    - {id: ocsvm_standard_g01, scaler: standard, params: {gamma: 0.1}}

# Mốc so sánh (không scale, tham số mặc định của model_params.yaml).
baselines: [zscore_baseline, rule_threshold_baseline, failure_count_baseline, random_baseline]

# Độ nhạy contamination: chạy lại CẤU HÌNH TỐT NHẤT của mỗi mô hình (PR-AUC trung bình cao nhất trên lưới)
# với từng mức: 0,1–5% theo mục 5.6 đề cương, thêm 10% và 20%. IF/LOF: chỉ ngưỡng đổi; OCSVM: nu = contamination
# nên chính mô hình cũng đổi.
contamination_sweep: [0.05]

sort_rows: true
drop_features:
- interarrival_dt_mean
- delta_t_cv
- same_second_share
- is_single_event
- activity_peak_hour_sin
- log_distinct_hosts
- missing_source_ratio
- dst_host_entropy
- log_total_logons
- custom_proc_share
- delta_mean_distinct_pair_7d
- new_host_count_7d
- peer_z_share_night
- rare_logon_type_count_log
- remote_logon_ratio
- volume_robust_z_7d
- off_hours_ratio
- delta_mean_distinct_fail_host_7d
- jaccard_logontype_7d
