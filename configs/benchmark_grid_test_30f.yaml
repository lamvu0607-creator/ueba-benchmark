# =============================================================================
# Khối TEST với bộ 30 đặc trưng (tuần 5) — bản sao của configs/benchmark_grid_test.yaml (cấu hình mô hình chốt
# từ dev, KHÔNG chọn lại), chỉ thêm:
#   drop_features: 11 đặc trưng bỏ theo ablation trên dev (reports/week5/ablation_nhom_dac_trung.md,
#                  cấu hình drop_rhythm_low_shap10); chỉ áp dụng cho mô hình ML, baseline giữ nguyên.
#   sort_rows:     sắp dòng cố định trước khi fit (thứ tự dòng làm lệch OCSVM/IF).
# =============================================================================
block: test
segment: User
output_dir: experiments/grid/test_30f
runs:
- data/injection_runs/test_seed20261061
- data/injection_runs/test_seed20261062
- data/injection_runs/test_seed20261063
- data/injection_runs/test_seed20261064
- data/injection_runs/test_seed20261065
model_seeds:
- 42
- 7
- 2024
- 1
- 2
contamination: 0.05
