# Hợp đồng schema đặc trưng (Feature Contract) — UEBA Anomaly Detection Benchmark
#
# Phiên bản : v2.0 (16 core) -> v3.0 (24 core) -> v4.0 (39 core)
#   * v4.0 (2026-10-04) bổ sung 15 đặc trưng sinh từ Combinatorial Template
#     (PHÉP ĐO × ĐỐI TƯỢNG × CHIỀU × CỬA SỔ, src/features/templates.py), chọn qua phễu:
#       3.136 tổ hợp → 471 hợp lệ ngữ pháp → vòng 1 (lập luận, luật R1–R4) còn 78
#       → vòng 2 (số liệu: E rò rỉ, B thông tin, A |rho| < 0,85, C phân tách kịch bản tiêm) còn 26
#       → chốt quy mô (~15, VIF ≤ 10): 15 vào core (nhóm 11), 11 vào `reserve:`.
#     Tính bằng src/features/template_engine.py. Căn cứ: docs/reports/bao_cao_bo_dac_trung_v4.md
#     52 ứng viên vòng 2 bị loại được ghi ở cuối mục `removed:` kèm cổng + số đo.
#   * v3.0 (2026-09-30) bổ sung 12 đặc trưng, TẤT CẢ đều chỉ dùng dữ liệu ≤ t−1:
#       nhóm 9 (trong ngày) : activity_peak_hour_sin/cos, hour_entropy, dst_host_entropy
#       nhóm 10 (lịch sử)   : new_source_count, new_host_count,
#                             new_source_count_7d, new_host_count_7d, source_recency,
#                             source_host_pair_novelty, days_since_last_activity,
#                             volume_robust_z_7d
#     2 đặc trưng đã cài + ĐO trên dữ liệu thật rồi bác bỏ (rho 0.9973 / 0.9180 với
#     failure_ratio) — xem mục `removed:` cuối file.
#     Căn cứ & danh sách Tier B/C còn lại: docs/reports/bao_cao_bo_dac_trung_v3.md
#
# Sinh bởi : src/features/extractor.py  (đường chuẩn: `python main.py --stage features`)
#            scripts/feature_engineering/extract_account_day_matrix.py (bản độc lập, CHẬM hơn 1 phiên bản)
# Căn cứ   : docs/feature_engineering/feature_correlation_review.md (§7 rút gọn, §11 kế hoạch sửa)
# Khoá bản ghi: (DomainName, UserName, day)
#
# Quy ước:
#   core: true        -> đưa vào model & bảng tương quan
#   core: false       -> chỉ giữ để đọc/pivot/báo cáo
#   model_transform   -> gợi ý tiền xử lý cho mô hình dựa trên khoảng cách (IForest/LOF/OCSVM)
#   nullable          -> có NULL hợp lệ (KHÔNG được fill bằng 0 một cách mù quáng)

identity:
  keys: ["DomainName", "UserName", "day"]
  label: "entity_type"
  label_values: ["Machine", "User", "Service", "System", "Admin", "Other"]
  display_only: ["total_logons"]

features:
  # ---------------- Nhóm 1: Khối lượng ----------------
  - name: log_total_logons
    group: volume
    definition: "log1p(số sự kiện 4624 + 4625 của khoá trong ngày)"
    core: true
    model_transform: none
    note: "Bản log được giữ; bản thô total_logons trùng hạng rho = 1.0000 nên chỉ để hiển thị."

  # ---------------- Nhóm 2: Thất bại ----------------
  - name: failure_ratio
    group: failure
    definition: "failure_count / total_logons"
    core: true
    model_transform: none
    note: "Đặc trưng cường độ thất bại DUY NHẤT. Bản 1.0 còn failure_count (rho = 0.9969)."

  - name: failure_locked_out_share
    group: failure
    definition: "count(FailureReason ~ 'account locked out') / failure_count"
    core: true
    model_transform: none
    nullable: "NULL khi failure_count = 0"
    note: "Tín hiệu lockout (brute force). Thay thế unknown_user_count (Status null 100%)."

  # --- Nhóm 2b (v3.0): ĐÃ ĐO VÀ BÁC BỎ — 2 biến chuỗi thất bại --------------------------
  # max_failure_streak / success_after_failure_ratio đã được cài + đo trên dữ liệu thật
  # (10 ngày, 180.606 dòng): ρ = 0,9973 và 0,9180 với failure_ratio ⇒ vượt ngưỡng 0,85.
  # Xem `removed:` ở cuối file.

  # ---------------- Nhóm 3: Thời gian / nhịp ----------------
  - name: off_hours_ratio
    group: time
    definition: "số sự kiện có (hour >= off_hours_start) hoặc (hour <= off_hours_end) / total_logons"
    core: true
    model_transform: none
    note: "Cửa sổ lấy từ config (18h-7h). work_hours_ratio đã bỏ vì off + work = 1 tuyệt đối."

  - name: interarrival_dt_mean
    group: rhythm
    definition: "trung bình delta_t (giây) giữa hai sự kiện liên tiếp của cùng khoá"
    core: true
    model_transform: log1p
    nullable: "NULL khi chỉ có 1 sự kiện"
    note: "ĐÃ BỎ fill_null(86400.0): trước đây 86400 chiếm 0.841% dòng, đúng bằng số dòng 1 sự kiện."

  - name: delta_t_cv
    group: rhythm
    definition: "std(delta_t) / mean(delta_t)"
    core: true
    model_transform: none
    nullable: "NULL khi chỉ có 1 sự kiện hoặc mean(delta_t) = 0"
    note: "Thay interarrival_dt_std (rho = 0.6020 với interarrival_dt_mean)."

  - name: same_second_share
    group: rhythm
    definition: "số sự kiện có delta_t = 0 / total_logons"
    core: true
    model_transform: none
    note: "Thay burst_logon_count: 70.57% sự kiện có delta_t = 0 nên bản count chỉ là proxy của volume."

  - name: is_single_event
    group: rhythm
    definition: "1 nếu khoá chỉ có đúng 1 sự kiện trong ngày"
    core: true
    model_transform: none
    note: "Cờ giải thích cho NULL của interarrival_dt_mean / delta_t_cv."

  # --- Nhóm 3b (v3.0): nhịp trong ngày — chỉ dùng trạng thái TRONG NGÀY ----------------
  - name: activity_peak_hour_sin
    group: rhythm
    definition: "sin(2*pi*h_peak/24) với h_peak = khung giờ có nhiều sự kiện nhất (hoà -> giờ nhỏ hơn)"
    core: true
    model_transform: none
    note: "v3.0. Mã hoá CHU KỲ: sin/cos phải đi thành cặp, không dùng số giờ thô (giờ 23 và 0 kề nhau nhưng lệch 23 đơn vị)."

  - name: activity_peak_hour_cos
    group: rhythm
    definition: "cos(2*pi*h_peak/24) — cặp với activity_peak_hour_sin"
    core: true
    model_transform: none
    note: "v3.0."

  - name: hour_entropy
    group: rhythm
    definition: "Pielou evenness = H / ln(S) của phân bố sự kiện trên các khung giờ có mặt trong ngày"
    core: true
    model_transform: none
    note: "v3.0. Đo độ TRẢI ĐỀU nhịp trong ngày (độc lập với khối lượng); = 0 khi mọi sự kiện cùng 1 khung giờ."

  # ---------------- Nhóm 4: Phương thức truy cập (đóng ràng buộc tổng = 1) ----------------
  - name: interactive_ratio
    group: logon_type
    definition: "count(LogonType = 2) / total_logons"
    core: true
    model_transform: none

  - name: rare_logon_type_count_log
    group: logon_type
    definition: "log1p(số sự kiện có LogonType không thuộc {2, 3})"
    core: true
    model_transform: none
    note: "Phản ánh type hiếm (0/4/5/7/8/9/10/11) — trong đó có RDP (type 10) và runas (type 9)."

  # ---------------- Nhóm 5: Xác thực ----------------
  - name: ntlm_ratio
    group: authentication
    definition: "count(AuthenticationPackage chứa 'ntlm') / total_logons"
    core: true
    model_transform: none
    note: "Lưu ý diễn giải: NTLM chiếm 48.18% sự kiện 4625 so với 17.35% ở 4624 -> là proxy của chế độ thất bại."

  # ---------------- Nhóm 6: Đa dạng thực thể ----------------
  - name: log_distinct_hosts
    group: fanout
    definition: "log1p(số LogHost duy nhất)"
    core: true
    model_transform: none
    note: "Giữ bản log; bản thô distinct_hosts_count trùng hạng rho = 1.0000."

  - name: distinct_sources_count
    group: fanout
    definition: "số Source duy nhất (bỏ null)"
    core: true
    model_transform: rank_gaussian
    note: "Skewness 139.08 -> nên dùng rank-Gaussian/winsorize thay vì chỉ log1p."

  - name: dst_host_entropy
    group: fanout
    definition: "Pielou evenness = H / ln(S) của phân bố sự kiện theo LogHost (S = số host phân biệt, H = Shannon entropy)"
    core: true
    model_transform: none
    note: "v3.0. Dùng evenness thay vì entropy thô vì entropy thô bị chặn bởi ln(n) -> trùng trục với log_total_logons. = 0 khi chỉ 1 host."

  # ---------------- Nhóm 7: Ngữ cảnh nguồn ----------------
  - name: missing_source_ratio
    group: context
    definition: "số sự kiện thiếu Source / total_logons"
    core: true
    model_transform: none
    note: "BẢN CHẤT LÀ CHỈ BÁO CHẤT LƯỢNG DỮ LIỆU: dùng làm covariate/chú thích, KHÔNG diễn giải thành tấn công."

  - name: remote_logon_ratio
    group: context
    definition: "số sự kiện có Source != LogHost (Source không null) / total_logons"
    core: true
    model_transform: none

  # ---------------- Nhóm 10 (v3.0): Tính mới & Lịch sử — CHỈ dùng dữ liệu ≤ t−1 ---------
  # 4/8 ứng viên đã bị BÁC BỎ sau khi đo trên dữ liệu thật (xem mục `removed:` cuối file):
  # new_source_count, new_host_count, source_recency, source_host_pair_novelty.
  - name: new_source_count_7d
    group: novelty
    definition: "số Source của ngày t KHÔNG thấy trong 7 NGÀY LỊCH gần nhất (t−7 … t−1)"
    core: true
    model_transform: log1p
    note: "v3.0 Tier A. Cửa sổ là ngày lịch (không phải '7 dòng trước đó' của panel thưa)."

  - name: new_host_count_7d
    group: novelty
    definition: "số LogHost của ngày t không thấy trong 7 ngày lịch gần nhất"
    core: true
    model_transform: log1p
    note: "v3.0 Tier A."

  - name: days_since_last_activity
    group: novelty
    definition: "số ngày kể từ phiên hoạt động gần nhất của tài khoản (t − max ngày < t)"
    core: true
    model_transform: log1p
    nullable: "NULL ở dòng hoạt động đầu tiên của tài khoản"
    note: "v3.0 Tier A. Bắt tài khoản 'ngủ đông' quay lại — bù cho điểm mù của volume_robust_z_7d."

  - name: volume_robust_z_7d
    group: deviation
    definition: "z bền vững của log1p(volume_t) so với 7 NGÀY LỊCH trước đó (median + IQR/1.349 → std → 0 với dung sai 1e-9), WINSORIZE ở ±10; ngày trống tính là volume 0"
    core: true
    model_transform: none
    nullable: "NULL khi chưa đủ 7 ngày lịch sử (warm-up)"
    note: "v3.0 Tier A. Winsorize ±10 là BẮT BUỘC: baseline cực ổn định (IQR ≈ 0) làm z hợp lệ về toán nhưng cực lớn — ví dụ thật User718489 (5.966–6.058 sự kiện/ngày trong 7 ngày rồi tụt còn 472) cho z = −976, đủ để lấn át khoảng cách của IForest/LOF/OCSVM. LƯU Ý diễn giải: nếu 7 ngày trước ĐỀU TRỐNG thì baseline không có độ tán xạ ⇒ quy ước z = 0; tín hiệu 'quay lại sau im lặng' nằm ở days_since_last_activity."

  - name: custom_proc_share
    group: context
    definition: "số sự kiện có ProcessName bắt đầu bằng 'proc' / total_logons"
    core: true
    model_transform: none
    note: "Thay 3 cờ has_process_info / has_system_process / has_custom_proc; là hệ quả của sơ đồ ẩn danh 'Proc<6 số>.exe'."

  # ---------------- Nhóm 11 (v4.0): sinh từ Combinatorial Template — qua phễu 2 vòng ----------------
  # Tên = measure_[base_][object_][entity_][window]; câu định nghĩa SINH TỰ ĐỘNG từ template
  # (src/features/templates.py). Giá trị đã ở dạng dùng cho model (đếm → log1p, peer_z cắt ±10)
  # nên model_transform = none. Số đo cổng: docs/feature_engineering/tables/v4_round2_gates.csv
  # (21 ngày LANL, 7 kịch bản tiêm tại ngày 21). Báo cáo: docs/reports/bao_cao_bo_dac_trung_v4.md
  - name: delta_mean_share_fail_7d
    group: template_v4
    definition: "tỷ lệ đăng nhập thất bại (4625) hôm nay trừ trung bình của 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL ở 7 ngày đầu của dải quan sát (warm-up) hoặc khi 7 ngày trước không có ngày hoạt động nào"
    template: {measure: delta_mean, object: fail, entity: event, window: 7d}
    scenarios: [brute_force, password_spraying]
    note: "v4.0. AUC 0.999 trên brute_force; max |rho| 0.8209 với delta_mean_distinct_fail_host_7d."

  - name: delta_mean_distinct_fail_host_7d
    group: template_v4
    definition: "log số máy đích (LogHost) khác nhau (đăng nhập thất bại (4625)) hôm nay trừ trung bình của 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL ở 7 ngày đầu của dải quan sát (warm-up)"
    template: {measure: delta_mean, object: fail, entity: LogHost, window: 7d}
    scenarios: [brute_force, password_spraying]
    note: "v4.0. AUC 0.990 trên password_spraying; max |rho| 0.6605 với failure_ratio."

  - name: novelty_fail_host_7d
    group: template_v4
    definition: "số máy đích (LogHost) trong đăng nhập thất bại (4625) hôm nay chưa xuất hiện trong 7 ngày lịch trước"
    core: true
    model_transform: none
    template: {measure: novelty, object: fail, entity: LogHost, window: 7d}
    scenarios: [brute_force, password_spraying]
    note: "v4.0. AUC 0.987 trên password_spraying; max |rho| 0.6348 với delta_mean_distinct_fail_host_7d."

  - name: novelty_fail_failreason_7d
    group: template_v4
    definition: "số lý do thất bại trong đăng nhập thất bại (4625) hôm nay chưa xuất hiện trong 7 ngày lịch trước"
    core: true
    model_transform: none
    template: {measure: novelty, object: fail, entity: fail_reason, window: 7d}
    scenarios: [brute_force]
    note: "v4.0. AUC 0.728 trên brute_force; max |rho| 0.8373 với novelty_fail_host_7d."

  - name: delta_mean_distinct_source_7d
    group: template_v4
    definition: "log số máy nguồn (Source) khác nhau (mọi sự kiện) hôm nay trừ trung bình của 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL ở 7 ngày đầu của dải quan sát (warm-up)"
    template: {measure: delta_mean, object: all, entity: Source, window: 7d}
    scenarios: [new_workstation_burst]
    note: "v4.0. AUC 1.000 trên new_workstation_burst; max |rho| 0.4451 với distinct_sources_count."

  - name: jaccard_source_7d
    group: template_v4
    definition: "độ trùng (Jaccard) giữa tập máy nguồn (Source) hôm nay và tập máy nguồn (Source) của 7 ngày lịch trước (mọi sự kiện)"
    core: true
    model_transform: none
    nullable: "NULL khi chưa có lịch sử 7 ngày của thực thể đó hoặc hôm nay không có sự kiện thuộc đối tượng"
    template: {measure: jaccard, object: all, entity: Source, window: 7d}
    scenarios: [new_workstation_burst]
    note: "v4.0. AUC 0.995 trên new_workstation_burst; max |rho| 0.7122 với dist_shift_source_7d."

  - name: peer_z_distinct_source
    group: template_v4
    definition: "z bền vững của log số máy nguồn (Source) khác nhau (mọi sự kiện) so với các tài khoản cùng loại (entity_type) trong cùng ngày"
    core: true
    model_transform: none
    template: {measure: peer_z, object: all, entity: Source, window: 1d}
    scenarios: [new_workstation_burst]
    note: "v4.0. AUC 1.000 trên new_workstation_burst; max |rho| 0.8305 với distinct_sources_count."

  - name: dist_shift_hour_7d
    group: template_v4
    definition: "khoảng cách phân bố (total variation) của mọi sự kiện theo khung giờ giữa hôm nay và 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL khi chưa có lịch sử 7 ngày của thực thể đó hoặc hôm nay không có sự kiện thuộc đối tượng"
    template: {measure: dist_shift, object: all, entity: hour, window: 7d}
    scenarios: [off_hours]
    note: "v4.0. AUC 0.987 trên off_hours; max |rho| 0.5707 với hour_entropy."

  - name: jaccard_hour_7d
    group: template_v4
    definition: "độ trùng (Jaccard) giữa tập khung giờ hôm nay và tập khung giờ của 7 ngày lịch trước (mọi sự kiện)"
    core: true
    model_transform: none
    nullable: "NULL khi chưa có lịch sử 7 ngày của thực thể đó hoặc hôm nay không có sự kiện thuộc đối tượng"
    template: {measure: jaccard, object: all, entity: hour, window: 7d}
    scenarios: [off_hours]
    note: "v4.0. AUC 0.984 trên off_hours; max |rho| 0.6915 với log_total_logons."

  - name: peer_z_share_night
    group: template_v4
    definition: "z bền vững của tỷ lệ sự kiện ngoài giờ (18h–7h) so với các tài khoản cùng loại (entity_type) trong cùng ngày"
    core: true
    model_transform: none
    template: {measure: peer_z, object: night, entity: event, window: 1d}
    scenarios: [off_hours]
    note: "v4.0. AUC 0.980 trên off_hours; max |rho| 0.7464 với off_hours_ratio."

  - name: delta_mean_distinct_pair_7d
    group: template_v4
    definition: "log số cặp (Source, LogHost) khác nhau (mọi sự kiện) hôm nay trừ trung bình của 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL ở 7 ngày đầu của dải quan sát (warm-up)"
    template: {measure: delta_mean, object: all, entity: pair, window: 7d}
    scenarios: [lateral_fanout, new_workstation_burst]
    note: "v4.0. AUC 1.000 trên lateral_fanout; max |rho| 0.7796 với delta_mean_distinct_source_7d."

  - name: novelty_share_pair_7d
    group: template_v4
    definition: "tỷ lệ mọi sự kiện hôm nay thuộc cặp (Source, LogHost) chưa xuất hiện trong 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL khi hôm nay không có sự kiện hợp lệ (Source/LogHost rỗng)"
    template: {measure: novelty_share, object: all, entity: pair, window: 7d}
    scenarios: [lateral_fanout, new_workstation_burst]
    note: "v4.0. AUC 0.990 trên lateral_fanout; max |rho| 0.7562 với new_host_count_7d."

  - name: delta_mean_count_7d
    group: template_v4
    definition: "log số mọi sự kiện hôm nay trừ trung bình của 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL ở 7 ngày đầu của dải quan sát (warm-up)"
    template: {measure: delta_mean, object: all, entity: event, window: 7d}
    scenarios: [dormant_wakeup]
    note: "v4.0. AUC 0.999 trên dormant_wakeup; max |rho| 0.7961 với delta_mean_distinct_pair_7d."

  - name: dist_shift_logontype_7d
    group: template_v4
    definition: "khoảng cách phân bố (total variation) của mọi sự kiện theo loại logon giữa hôm nay và 7 ngày lịch trước"
    core: true
    model_transform: none
    nullable: "NULL khi chưa có lịch sử 7 ngày của thực thể đó hoặc hôm nay không có sự kiện thuộc đối tượng"
    template: {measure: dist_shift, object: all, entity: logon_type, window: 7d}
    scenarios: [logon_type_switch]
