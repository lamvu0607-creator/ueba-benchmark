# Hợp đồng schema đặc trưng (Feature Contract) — UEBA Anomaly Detection Benchmark
#
# Phiên bản : v2.0 (16 core) -> v3.0 (28 core)
#   * v3.0 (2026-09-30) bổ sung 12 đặc trưng, TẤT CẢ đều chỉ dùng dữ liệu ≤ t−1:
#       nhóm 9 (trong ngày) : activity_peak_hour_sin/cos, hour_entropy, dst_host_entropy
#       nhóm 10 (lịch sử)   : new_source_count, new_host_count,
#                             new_source_count_7d, new_host_count_7d, source_recency,
#                             source_host_pair_novelty, days_since_last_activity,
#                             volume_robust_z_7d
#     2 đặc trưng đã cài + ĐO trên dữ liệu thật rồi bác bỏ (rho 0.9973 / 0.9180 với
#     failure_ratio) — xem mục `removed:` cuối file.
#     Căn cứ & danh sách Tier B/C còn lại: docs/reports/bao_cao_bo_dac_trung_v3.md
#
# Sinh bởi : src/features/extractor.py  (đường chuẩn: `python main.py --stage features`)
#            scripts/feature_engineering/extract_account_day_matrix.py (bản độc lập, CHẬM hơn 1 phiên bản)
# Căn cứ   : docs/feature_engineering/feature_correlation_review.md (§7 rút gọn, §11 kế hoạch sửa)
# Khoá bản ghi: (DomainName, UserName, day)
#
# Quy ước:
#   core: true        -> đưa vào model & bảng tương quan
#   core: false       -> chỉ giữ để đọc/pivot/báo cáo
#   model_transform   -> gợi ý tiền xử lý cho mô hình dựa trên khoảng cách (IForest/LOF/OCSVM)
#   nullable          -> có NULL hợp lệ (KHÔNG được fill bằng 0 một cách mù quáng)

identity:
  keys: ["DomainName", "UserName", "day"]
  label: "entity_type"
  label_values: ["Machine", "User", "Service", "System", "Admin", "Other"]
  display_only: ["total_logons"]

features:
  # ---------------- Nhóm 1: Khối lượng ----------------
  - name: log_total_logons
    group: volume
    definition: "log1p(số sự kiện 4624 + 4625 của khoá trong ngày)"
    core: true
    model_transform: none
    note: "Bản log được giữ; bản thô total_logons trùng hạng rho = 1.0000 nên chỉ để hiển thị."

  # ---------------- Nhóm 2: Thất bại ----------------
  - name: failure_ratio
    group: failure
    definition: "failure_count / total_logons"
    core: true
    model_transform: none
    note: "Đặc trưng cường độ thất bại DUY NHẤT. Bản 1.0 còn failure_count (rho = 0.9969)."

  - name: failure_locked_out_share
    group: failure
    definition: "count(FailureReason ~ 'account locked out') / failure_count"
    core: true
    model_transform: none
    nullable: "NULL khi failure_count = 0"
    note: "Tín hiệu lockout (brute force). Thay thế unknown_user_count (Status null 100%)."

  # --- Nhóm 2b (v3.0): ĐÃ ĐO VÀ BÁC BỎ — 2 biến chuỗi thất bại --------------------------
  # max_failure_streak / success_after_failure_ratio đã được cài + đo trên dữ liệu thật
  # (10 ngày, 180.606 dòng): ρ = 0,9973 và 0,9180 với failure_ratio ⇒ vượt ngưỡng 0,85.
  # Xem `removed:` ở cuối file.

  # ---------------- Nhóm 3: Thời gian / nhịp ----------------
  - name: off_hours_ratio
    group: time
    definition: "số sự kiện có (hour >= off_hours_start) hoặc (hour <= off_hours_end) / total_logons"
    core: true
    model_transform: none
    note: "Cửa sổ lấy từ config (18h-7h). work_hours_ratio đã bỏ vì off + work = 1 tuyệt đối."

  - name: interarrival_dt_mean
    group: rhythm
    definition: "trung bình delta_t (giây) giữa hai sự kiện liên tiếp của cùng khoá"
    core: true
    model_transform: log1p
    nullable: "NULL khi chỉ có 1 sự kiện"
    note: "ĐÃ BỎ fill_null(86400.0): trước đây 86400 chiếm 0.841% dòng, đúng bằng số dòng 1 sự kiện."

  - name: delta_t_cv
    group: rhythm
    definition: "std(delta_t) / mean(delta_t)"
    core: true
    model_transform: none
    nullable: "NULL khi chỉ có 1 sự kiện hoặc mean(delta_t) = 0"
    note: "Thay interarrival_dt_std (rho = 0.6020 với interarrival_dt_mean)."

  - name: same_second_share
    group: rhythm
    definition: "số sự kiện có delta_t = 0 / total_logons"
    core: true
    model_transform: none
    note: "Thay burst_logon_count: 70.57% sự kiện có delta_t = 0 nên bản count chỉ là proxy của volume."

  - name: is_single_event
    group: rhythm
    definition: "1 nếu khoá chỉ có đúng 1 sự kiện trong ngày"
    core: true
    model_transform: none
    note: "Cờ giải thích cho NULL của interarrival_dt_mean / delta_t_cv."

  # --- Nhóm 3b (v3.0): nhịp trong ngày — chỉ dùng trạng thái TRONG NGÀY ----------------
  - name: activity_peak_hour_sin
    group: rhythm
    definition: "sin(2*pi*h_peak/24) với h_peak = khung giờ có nhiều sự kiện nhất (hoà -> giờ nhỏ hơn)"
    core: true
    model_transform: none
    note: "v3.0. Mã hoá CHU KỲ: sin/cos phải đi thành cặp, không dùng số giờ thô (giờ 23 và 0 kề nhau nhưng lệch 23 đơn vị)."

  - name: activity_peak_hour_cos
    group: rhythm
    definition: "cos(2*pi*h_peak/24) — cặp với activity_peak_hour_sin"
    core: true
    model_transform: none
    note: "v3.0."

  - name: hour_entropy
    group: rhythm
    definition: "Pielou evenness = H / ln(S) của phân bố sự kiện trên các khung giờ có mặt trong ngày"
    core: true
    model_transform: none
    note: "v3.0. Đo độ TRẢI ĐỀU nhịp trong ngày (độc lập với khối lượng); = 0 khi mọi sự kiện cùng 1 khung giờ."

  # ---------------- Nhóm 4: Phương thức truy cập (đóng ràng buộc tổng = 1) ----------------
  - name: interactive_ratio
    group: logon_type
    definition: "count(LogonType = 2) / total_logons"
    core: true
    model_transform: none

  - name: rare_logon_type_count_log
    group: logon_type
    definition: "log1p(số sự kiện có LogonType không thuộc {2, 3})"
    core: true
    model_transform: none
    note: "Phản ánh type hiếm (0/4/5/7/8/9/10/11) — trong đó có RDP (type 10) và runas (type 9)."

  # ---------------- Nhóm 5: Xác thực ----------------
  - name: ntlm_ratio
    group: authentication
    definition: "count(AuthenticationPackage chứa 'ntlm') / total_logons"
    core: true
    model_transform: none
    note: "Lưu ý diễn giải: NTLM chiếm 48.18% sự kiện 4625 so với 17.35% ở 4624 -> là proxy của chế độ thất bại."

  # ---------------- Nhóm 6: Đa dạng thực thể ----------------
  - name: log_distinct_hosts
    group: fanout
    definition: "log1p(số LogHost duy nhất)"
    core: true
    model_transform: none
    note: "Giữ bản log; bản thô distinct_hosts_count trùng hạng rho = 1.0000."

  - name: distinct_sources_count
    group: fanout
    definition: "số Source duy nhất (bỏ null)"
    core: true
    model_transform: rank_gaussian
    note: "Skewness 139.08 -> nên dùng rank-Gaussian/winsorize thay vì chỉ log1p."

  - name: dst_host_entropy
    group: fanout
    definition: "Pielou evenness = H / ln(S) của phân bố sự kiện theo LogHost (S = số host phân biệt, H = Shannon entropy)"
    core: true
    model_transform: none
    note: "v3.0. Dùng evenness thay vì entropy thô vì entropy thô bị chặn bởi ln(n) -> trùng trục với log_total_logons. = 0 khi chỉ 1 host."

  # ---------------- Nhóm 7: Ngữ cảnh nguồn ----------------
  - name: missing_source_ratio
    group: context
    definition: "số sự kiện thiếu Source / total_logons"
    core: true
    model_transform: none
    note: "BẢN CHẤT LÀ CHỈ BÁO CHẤT LƯỢNG DỮ LIỆU: dùng làm covariate/chú thích, KHÔNG diễn giải thành tấn công."

  - name: remote_logon_ratio
    group: context
    definition: "số sự kiện có Source != LogHost (Source không null) / total_logons"
    core: true
    model_transform: none

  # ---------------- Nhóm 10 (v3.0): Tính mới & Lịch sử — CHỈ dùng dữ liệu ≤ t−1 ---------
  # 4/8 ứng viên đã bị BÁC BỎ sau khi đo trên dữ liệu thật (xem mục `removed:` cuối file):
  # new_source_count, new_host_count, source_recency, source_host_pair_novelty.
  - name: new_source_count_7d
    group: novelty
    definition: "số Source của ngày t KHÔNG thấy trong 7 NGÀY LỊCH gần nhất (t−7 … t−1)"
    core: true
    model_transform: log1p
    note: "v3.0 Tier A. Cửa sổ là ngày lịch (không phải '7 dòng trước đó' của panel thưa)."

  - name: new_host_count_7d
    group: novelty
    definition: "số LogHost của ngày t không thấy trong 7 ngày lịch gần nhất"
    core: true
    model_transform: log1p
    note: "v3.0 Tier A."

  - name: days_since_last_activity
    group: novelty
    definition: "số ngày kể từ phiên hoạt động gần nhất của tài khoản (t − max ngày < t)"
    core: true
    model_transform: log1p
    nullable: "NULL ở dòng hoạt động đầu tiên của tài khoản"
    note: "v3.0 Tier A. Bắt tài khoản 'ngủ đông' quay lại — bù cho điểm mù của volume_robust_z_7d."

  - name: volume_robust_z_7d
    group: deviation
    definition: "z bền vững của log1p(volume_t) so với 7 NGÀY LỊCH trước đó (median + IQR/1.349 → std → 0 với dung sai 1e-9), WINSORIZE ở ±10; ngày trống tính là volume 0"
    core: true
    model_transform: none
    nullable: "NULL khi chưa đủ 7 ngày lịch sử (warm-up)"
    note: "v3.0 Tier A. Winsorize ±10 là BẮT BUỘC: baseline cực ổn định (IQR ≈ 0) làm z hợp lệ về toán nhưng cực lớn — ví dụ thật User718489 (5.966–6.058 sự kiện/ngày trong 7 ngày rồi tụt còn 472) cho z = −976, đủ để lấn át khoảng cách của IForest/LOF/OCSVM. LƯU Ý diễn giải: nếu 7 ngày trước ĐỀU TRỐNG thì baseline không có độ tán xạ ⇒ quy ước z = 0; tín hiệu 'quay lại sau im lặng' nằm ở days_since_last_activity."

  - name: custom_proc_share
    group: context
    definition: "số sự kiện có ProcessName bắt đầu bằng 'proc' / total_logons"
    core: true
    model_transform: none
    note: "Thay 3 cờ has_process_info / has_system_process / has_custom_proc; là hệ quả của sơ đồ ẩn danh 'Proc<6 số>.exe'."

# ---------------------------------------------------------------------------
# CHƯA triển khai (roadmap v3.0) — xem docs/reports/bao_cao_bo_dac_trung_v3.md §5
# ---------------------------------------------------------------------------
# Tier A: đã triển khai ĐỦ (4 biến nhóm 9 + 8 biến nhóm 10 = 28 core).
# Tier B (thử nghiệm/ablation, không nạp vector chính):
#   interarrival_dt_p50, max_interarrival_dt, burst_event_count_60s,
#   log_total_logons_lag1, log_total_logons_lag7, delta_log_total_logons_1d,
#   delta_log_total_logons_7d, volume_trend_slope_7d, ewma_volume_7d, volume_rolling_mean_7d,
#   source_set_novelty, host_set_novelty, new_source_count_14d, new_host_count_14d, host_recency,
#   peer_volume_ratio, peer_volume_robust_z, peer_failure_ratio_diff, peer_distinct_hosts_diff,
#   peer_off_hours_diff, peer_jaccard_similarity,
#   failure_ratio_robust_z_7d, distinct_hosts_robust_z_7d, off_hours_robust_z_7d,
#   ntlm_robust_z_7d, failure_ratio_lag1,
#   logon_type_entropy, src_host_entropy, src_dst_pair_entropy, dst_host_concentration_ratio
# Tier C (chẩn đoán/luật + chỉ mục panel, KHÔNG vào vector):
#   volume_residual, residual_robust_zscore, residual_abs_exceed_3sigma, behavior_shift_score_7d,
#   day, week, day_of_week
deferred: []

# ---------------------------------------------------------------------------
# Đã LOẠI BỎ so với bản 1.0 (xem §5 và §7.1 của review) — kèm lý do
# ---------------------------------------------------------------------------
removed:
  - name: total_logons
    reason: "Trùng hạng rho = 1.0000 với log_total_logons (nay chỉ giữ làm cột hiển thị)."
  - name: off_hours_count
    reason: "Trùng total_logons (rho = 0.7818) và off_hours_ratio (rho = 0.7261)."
  - name: work_hours_ratio
    reason: "Sau khi phủ đủ 24h, off_hours_ratio + work_hours_ratio = 1 tuyệt đối."
  - name: burst_logon_count
    reason: "70.57% sự kiện có delta_t = 0 -> chỉ là proxy của volume; VIF 3977.17."
  - name: interarrival_dt_std
    reason: "rho = 0.6020 với interarrival_dt_mean -> đã thay bằng delta_t_cv."
  - name: failure_count
    reason: "rho = 0.9969 với failure_ratio."
  - name: wrong_password_count
    reason: "ĐẶC TRƯNG CHẾT: Status null 100% nên luôn bằng 0."
  - name: unknown_user_count
    reason: "ĐẶC TRƯNG CHẾT: Status null 100% nên luôn bằng 0."
  - name: distinct_hosts_count
    reason: "Trùng hạng rho = 1.0000 với log_distinct_hosts."
  - name: rdp_ratio
    reason: "Type 10 chỉ chiếm 0.013% sự kiện (96.33% dòng = 0); RDP vẫn được phản ánh qua other_logon_type_ratio."
  - name: service_ratio
    reason: "99.73% dòng = 0."
  - name: batch_ratio
    reason: "99.57% dòng = 0."
  - name: has_local_logon
    reason: "rho = 0.9738 với has_process_info; bị nhiễu bởi Source null (24.28% / 32.09%)."
  - name: has_process_info
    reason: "ProcessName null 92.37% ở 4624 -> proxy của 'có sự kiện không phải Network'."
  - name: has_system_process
    reason: "Tập con của has_process_info (rho = 0.9455); danh sách 4 tên hard-code."
  - name: has_custom_proc
    reason: "Đã thay bằng custom_proc_share (dạng tỷ trọng thay vì cờ nhị phân)."
  - name: has_system_logon_id
    reason: "Proxy của failure (rho = 0.9104) qua LogonID = 0x3e7 của 4625."
  - name: has_remote_logon
    reason: "Prevalence 96.60% -> gần hằng số."
  - name: has_missing_source
    reason: "Bản nhị phân hoá của missing_source_ratio (rho = 0.7689)."
  - name: has_multi_domains
    reason: "99.18% dòng = 0; và sau khi sửa khoá thì mỗi dòng chỉ còn 1 DomainName."
  - name: has_local_domain
    reason: "Heuristic startsWith('comp') bắt 0.05% sự kiện 4624 nhưng 9.06% ở 4625 -> thực chất là đếm thất bại."
  - name: network_ratio
    reason: "Gần hằng số (median = 1.000; chỉ 2.46% dòng = 0) và rho = 0.9031 với rare_logon_type_count_log. Thông tin 'tài khoản mạng' đã nằm ở nhãn entity_type."
  - name: other_logon_type_ratio
    reason: "ĐÃ THỬ và BÁC BỎ: 3 ratio (network + interactive + other) cộng lại bằng 1 tạo phụ thuộc tuyến tính tuyệt đối, VIF ~ 5.2e7."
  - name: distinct_logon_types
    reason: "rho = 0.8799 với network_ratio (ngày toàn type 3 -> giá trị = 1)."
  - name: failure_bad_password_share
    reason: "ĐÃ THỬ và BÁC BỎ: rho = 0.9220 với failure_ratio (mọi lý do thất bại đều là bằng chứng 'có thất bại')."
  - name: max_failure_streak
    reason: "v3.0, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9973 với failure_ratio (10 ngày, 180.606 dòng; max |rho|/Pearson-Spearman). Cơ chế: 87,04% dòng = 0 (ngày không có thất bại) và các 4625 tập trung theo cụm ⇒ chuỗi thất bại chỉ là proxy của cường độ thất bại, đúng loại trùng lặp đã loại failure_count (0.9969)."
  - name: success_after_failure_ratio
    reason: "v3.0, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9180 với failure_ratio và 0.9261 với max_failure_streak. Cơ chế: dùng chung chỉ báo 'ngày có thất bại hay không' (88,50% dòng = 0) — cùng cơ chế đã loại failure_bad_password_share (0.9220)."
  - name: new_source_count
    reason: "v3.0 nhóm 10, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9999 với new_source_count_7d (10 ngày, 180.606 dòng) — trên LANL, lần xuất hiện ĐẦU TIÊN của một Source gần như luôn nằm ngoài cửa sổ 7 ngày, nên bản 'toàn lịch sử' và bản '7 ngày' là cùng một biến. Giữ bản _7d vì ít bị cold-start ở đầu dải quan sát."
  - name: new_host_count
    reason: "v3.0 nhóm 10, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9999 với new_host_count_7d (cùng cơ chế như new_source_count). Ở bản 28 biến, cặp này đẩy VIF lên 8.197."
  - name: source_recency
    reason: "v3.0 nhóm 10, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9238 với days_since_last_activity — hai biến cùng đo 'khoảng cách tới lần hoạt động gần nhất'; giữ days_since_last_activity vì phạm vi tài khoản và bù được điểm mù của volume_robust_z_7d."
  - name: source_host_pair_novelty
    reason: "v3.0 nhóm 10, ĐÃ CÀI + ĐO rồi BÁC BỎ: rho = 0.9052 với new_host_count (và 0.8004 với new_source_count) — một LogHost mới gần như luôn kéo theo một cặp (Source,LogHost) mới ⇒ cùng một trục 'đích mới'."
  - name: volume_residual
    reason: "Đề xuất Tier C của báo cáo v3.0: giữ ở tầng CHẨN ĐOÁN/luật, không nạp vector (không có trong features)."
  - name: behavior_shift_score_7d
    reason: "Đề xuất Tier C: chỉ số tổng hợp để xếp hạng rủi ro cho SOC, không phải đặc trưng hành vi."
